<rml>

    <head>
        <link type="text/rcss" href="main.css" />
    </head>

    <body>
        <div class="window" id="main_window">
            <div class="title-bar" id="title-bar">
                <img class="title-icon" src="assets/logo.svg" />
                <span class="title">CachyRS</span>

                <span class="title-version" id="title-version"></span>

                <span class="title-buttons">
                    <button class="icon-button" id="verify_button" data-tooltip="Verify reversed offsets">
                        <img class="icon-button-img" src="assets/icon-check.svg" />
                    </button>
                    <button class="icon-button" id="refresh_button" data-tooltip="Reload UI">
                        <img class="icon-button-img" src="assets/icon-refresh.svg" />
                    </button>
                </span>
            </div>
            <div class="tab-bar">
                <button class="tab-button" id="home_tab_button">
                    Home
                </button>
                <button class="tab-button" id="plugins_tab_button">
                    Plugins
                </button>
                <button class="tab-button" id="debug_tab_button">
                    Debug
                </button>
                <button class="tab-button" id="logs_tab_button">
                    Logs
                </button>
            </div>
            <div class="content" style="display:none;" id="home_content">
                <p>Welcome to CachyRS :) WIP.</p>
            </div>
            <div class="plugins-wrapper" style="display:none;" id="plugins_content">
                <div class="sidebar" id="plugins_buttons">
                </div>
            </div>
            <div class="content" style="display:none;" id="debug_content">
                <div class="debug-toolbar">
                    <button class="icon-button" id="widget_pick_button" data-tooltip="Pick widget">
                        <img class="icon-button-img" src="assets/icon-pick.svg" />
                    </button>
                    <button class="icon-button" id="widget_pick_menu_button" data-tooltip="Pick widget with menu options">
                        <img class="icon-button-img" src="assets/icon-pick-menu.svg" />
                    </button>
                </div>
                <div class="dom-viewer">
                    <div class="dom-pane">
                        <div class="dom-pane-header">Elements</div>
                        <div class="dom-tree" id="dom-tree">
                        </div>
                    </div>
                    <div class="dom-pane dom-pane-side">
                        <div class="dom-pane-header">Properties</div>
                        <div class="dom-inspector" id="dom-inspector">
                        </div>
                    </div>
                </div>
            </div>
            <div class="content" style="display:none;" id="logs_content">
                <div class="log-toolbar">
                    <button class="log-toolbar-button" id="logs_clear_button">Clear</button>
                </div>
                <div class="log-list" id="log-list">
                </div>
            </div>
            <div id="icon_tooltip" class="icon-tooltip" style="display:none;"></div>
        </div>
    </body>
</rml>
